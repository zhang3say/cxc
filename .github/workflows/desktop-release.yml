name: 'desktop-release'

on:
  push:
    tags:
      - 'cxc-desktop-v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: cxc-desktop/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: install frontend dependencies
        run: npm ci
        working-directory: cxc-desktop

      - name: run core tests
        run: cargo test -p cxc-core

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: cxc-desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'CXC ${{ github.ref_name }}'
          releaseBody: |
            CXC ${{ github.ref_name }}.

            这是 CXC 的新版本，取代旧的 cxc-desktop。首次启动会自动接管旧版配置：
            - 旧版 `~/.config/cxc/config.yaml`（或 Windows 的 `%APPDATA%\cxc\config.yaml`）会被备份后迁移；
            - 若本机存在上一代 `cxc-v2` 配置，会优先接管它。

            This is the new CXC release replacing cxc-desktop. Existing configuration is migrated automatically on first launch, with a backup kept next to the original file.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
